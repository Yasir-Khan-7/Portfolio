<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Portfolio/images/favicon/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eae4" />

    <!-- Generated at build time by the static-seo plugin in vite.config.ts from
         src/data/services.ts, so the head and the page cannot describe different
         offers. Flat file on purpose: GitHub Pages serves this at
         /Portfolio/services with a 200 and no redirect. -->
    <!--seo:head-->
  </head>
  <body>
    <!--
      THESIS: The services page is a steel-framed glass partition — a wall of panes held in matte
      black glazing bars, where one pane makes one statement. It refuses the freelance-services
      default (three icon-heading-text cards, a numbered process strip, a pricing table, a
      testimonial carousel) and it refuses cloning the portfolio's run-view canvas.
      OWN-WORLD: Clear and seeded glass are the calm ground; matte black bars are the only line ink
      and are drawn as the grid's own gaps, so every mullion is true and unbroken. Cobalt, amber and
      oxblood are spent only on what matters now — the primary action, one note per offer, and the
      "not included" terms. Archivo carries over from the portfolio but is driven to the opposite end
      of its width axis: 62 here for a tall condensed grotesque against the run view's 118. There is
      not a single shadow on the surface; depth is glass and steel.
      STORY: An agency lead, founder or first-job candidate lands cold, reads any single pane without
      reading the rest, sees two client systems already delivered, and sends a brief.
      FIRST VIEWPORT: A masthead of panes whose entire navigation is BACK TO PORTFOLIO. Below it the
      wall opens on its largest pane carrying the h1 in condensed caps, a cobalt pane beside it
      holding availability, a seeded pane of standing facts, then the actions set into the bars with
      an amber note, then the elevation key naming all seven bays.
      FORM: Glazier colour-field partition — a catalogue challenger, chosen by the site owner over
      the assigned direction; direction seed key 6c8e8646.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <!--
      The markup inside #root below is generated from src/data/services.ts at build time and is
      replaced by React on mount. It exists because the AI crawlers — GPTBot, ClaudeBot,
      PerplexityBot — fetch this file but never execute its JavaScript, so an empty root is all
      they would otherwise read. It is generated rather than hand-written so it cannot drift from
      what the page actually renders.
    -->
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
