<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Muhammad Yasir Khan | Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — MIT License — https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 because the site is served from the /Portfolio/ project subpath.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
